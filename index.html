<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solresol Visualizer</title>
<script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --do:  #FF3B3B; --re: #FF8C00; --mi: #FFD700;
  --fa:  #22BB55; --sol:#2288FF; --la: #8833CC; --si: #CC44FF;
}

body {
  background: #0d0f1e;
  color: #ccc;
  font-family: 'Georgia', 'Times New Roman', serif;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2rem;
  padding: 2rem 1rem;
  transition: background-color 0.5s ease;
  cursor: default;
}

h1 {
  font-size: 1.4rem;
  font-weight: normal;
  letter-spacing: 0.6em;
  text-transform: uppercase;
  color: #555;
}

/* ── Input area ── */
.input-area {
  display: flex;
  gap: 0.7rem;
  width: 100%;
  max-width: 640px;
  transition: opacity 0.4s, transform 0.4s;
}
body.playing .input-area {
  opacity: 0;
  pointer-events: none;
  transform: translateY(6px);
}
.eng-input {
  flex: 1;
  background: #141628;
  border: 1px solid #333;
  color: #ddd;
  padding: 0.6rem 1rem;
  border-radius: 7px;
  font-family: inherit;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}
.eng-input:focus { border-color: #555; }
.eng-input::placeholder { color: #444; }

/* ── Phrase display ── */
.phrase {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  flex-wrap: wrap;
  gap: 0.4rem 1.2rem;
  min-height: 5rem;
}

.word-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.3rem;
  padding: 0.6rem 0.8rem;
  border-radius: 10px;
  border: 1px solid transparent;
  transition: border-color 0.25s, background 0.25s, transform 0.25s, box-shadow 0.25s;
}
.word-group.active { transform: translateY(-4px); }

.eng {
  font-size: 1.9rem;
  color: #555;
  transition: color 0.25s, font-size 0.25s;
  line-height: 1.1;
}
.word-group.active .eng { color: #fff; font-size: 2.4rem; }

.syls {
  display: flex;
  gap: 3px;
  font-size: 0.85rem;
  font-style: italic;
  color: #333;
  transition: font-size 0.25s;
  align-items: center;
  min-height: 1.4em;
}
.word-group.active .syls { font-size: 1.05rem; }

.syl {
  transition: text-shadow 0.2s, opacity 0.2s, font-size 0.15s;
  opacity: 0.45;
}
.word-group.active .syl {
  opacity: 1;
  text-shadow: 0 0 14px currentColor, 0 0 30px currentColor;
}
.syl.current {
  font-size: 1.55em;
  text-shadow: 0 0 14px currentColor, 0 0 30px currentColor, 0 0 55px currentColor;
}
.word-group.unknown .eng  { color: #333; font-size: 1.4rem; }
.word-group.unknown .syls { font-size: 0.75rem; }
.sep { color: #333; }

/* ── Staff ── */
.staff-wrap {
  width: 100%;
  max-width: 860px;
  background: #f7f5ee;
  border-radius: 14px;
  padding: 1.2rem 1.8rem;
  box-shadow: 0 6px 30px rgba(0,0,0,0.6);
  overflow: hidden;
}
#staff { display: block; width: 100%; height: auto; }

/* ── Controls ── */
.controls {
  display: flex;
  align-items: center;
  gap: 1.2rem;
  flex-wrap: wrap;
  justify-content: center;
  transition: opacity 0.4s, transform 0.4s;
}
body.playing .controls {
  opacity: 0;
  pointer-events: none;
  transform: translateY(8px);
}

.btn {
  background: transparent;
  color: #888;
  border: 1px solid #333;
  padding: 0.55rem 1.4rem;
  border-radius: 7px;
  font-family: inherit;
  font-size: 1rem;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  min-width: 7rem;
}
.btn:hover { border-color: #777; color: #ddd; }
.btn.play  { border-color: #2288FF; color: #2288FF; }
.btn.play:hover { background: #2288FF; color: #fff; }
select.btn {
  background: #0d0f1e;
  cursor: pointer;
  padding-right: 0.8rem;
  transition: border-color 0.15s, color 0.15s, background 0.15s, opacity 0.3s;
}
select.btn.loading {
  opacity: 0.5;
  cursor: wait;
}

.tempo-row {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  color: #555;
  font-size: 0.9rem;
}
input[type=range] { width: 90px; accent-color: #2288FF; cursor: pointer; }
#bpmVal { color: #777; min-width: 2.5em; }

/* ── Pause hint ── */
.pause-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.75rem;
  color: #333;
  letter-spacing: 0.08em;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s;
}
body.playing .pause-hint { opacity: 1; }

.note-label { font-size: 0.72rem; color: #333; letter-spacing: 0.03em; }

/* ── Download / share row ── */
.dl-row {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.3rem;
}
.btn.dl { font-size: 0.8rem; padding: 0.35rem 0.8rem; color: #666; border-color: #333; }
.btn.dl:hover { color: #ccc; border-color: #666; }
.btn.dl.working { opacity: 0.5; cursor: wait; pointer-events: none; }
</style>
</head>
<body>

<h1>Solresol</h1>

<div class="input-area">
  <input class="eng-input" id="engInput" type="text"
         placeholder="Type English text to translate…">
</div>

<div id="phrase" class="phrase"></div>

<div class="staff-wrap">
  <svg id="staff" viewBox="0 0 820 200" xmlns="http://www.w3.org/2000/svg"></svg>
</div>

<div class="controls">
  <button class="btn play" id="playBtn">▶  Play</button>
  <button class="btn"      id="resetBtn">↺  Reset</button>
  <select class="btn" id="instrument">
    <option value="piano">Piano</option>
    <option value="marimba">Marimba</option>
    <option value="flute">Flute</option>
    <option value="organ">Organ</option>
    <option value="bell">Bell</option>
    <option value="strings">Strings</option>
  </select>
  <div class="tempo-row">
    <span>♩ =</span>
    <input type="range" id="tempo" min="40" max="160" value="72">
    <span id="bpmVal">72</span>
  </div>
  <div class="dl-row">
    <button class="btn dl" id="dlAudioBtn">⬇ Audio</button>
    <button class="btn dl" id="dlVideoBtn">⬇ Video</button>
    <button class="btn dl" id="copyUrlBtn">🔗 Copy URL</button>
  </div>
</div>

<div class="pause-hint">click anywhere to pause</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONSTANTS
// ─────────────────────────────────────────────────────────────────────────────
const COLOR = {
  Do:'#FF3B3B', Re:'#FF8C00', Mi:'#FFD700',
  Fa:'#22BB55', Sol:'#2288FF', La:'#8833CC', Si:'#CC44FF',
};
const NOTE_Y  = { Do:130, Re:123, Mi:115, Fa:108, Sol:100, La:93, Si:85 };
const NOTE_PITCH = { Do:'C4', Re:'D4', Mi:'E4', Fa:'F4', Sol:'G4', La:'A4', Si:'B4' };

const STAFF_LINES = [55,70,85,100,115];
const CLEF_W=72, PAD_R=30, SVG_W=820, NOTE_RX=8, NOTE_RY=6;
const NS = 'http://www.w3.org/2000/svg';

// ─────────────────────────────────────────────────────────────────────────────
// DICTIONARY
// ─────────────────────────────────────────────────────────────────────────────
// SOLRESOL_DICT is injected above as a const from the embedded JSON.

function splitSol(key) {
  const s=[]; let i=0;
  while(i<key.length){
    if(key.slice(i,i+3)==='sol'){s.push('Sol');i+=3;}
    else if(key.slice(i,i+2)==='do'){s.push('Do');i+=2;}
    else if(key.slice(i,i+2)==='re'){s.push('Re');i+=2;}
    else if(key.slice(i,i+2)==='mi'){s.push('Mi');i+=2;}
    else if(key.slice(i,i+2)==='fa'){s.push('Fa');i+=2;}
    else if(key.slice(i,i+2)==='la'){s.push('La');i+=2;}
    else if(key.slice(i,i+2)==='si'){s.push('Si');i+=2;}
    else i++;
  }
  return s;
}

function translate(text) {
  const tokens = text.trim().toLowerCase().split(/\s+/);
  return tokens.map(tok => {
    let clean = tok.replace(/[^a-z']/g,'');
    // Normalize contractions: strip possessive 's and verb suffixes
    // "it's"->"it", "you're"->"you", "I'm"->"i", "name's"->"name", etc.
    let key = SOLRESOL_DICT[clean];
    if (!key && clean.includes("'")) {
      const base = clean.split("'")[0];
      key = SOLRESOL_DICT[base];
    }
    const syls = key ? splitSol(key) : null;
    return {
      english: tok,
      solresol: syls || [],
      unknown: !syls,
    };
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────────────────
let PHRASE = translate('What is your name');
let SEQ    = [];
let cur=-1, curWord=-1, playing=false, timer=null;

// ─────────────────────────────────────────────────────────────────────────────
// AUDIO
// ─────────────────────────────────────────────────────────────────────────────
const SYNTH_CONFIGS = {
  marimba: { oscillator:{type:'triangle8'}, envelope:{attack:0.01,decay:0.4, sustain:0.15,release:1.4} },
  flute:   { oscillator:{type:'sine'},      envelope:{attack:0.12,decay:0.1, sustain:0.75,release:0.9} },
  organ:   { oscillator:{type:'square8'},   envelope:{attack:0.01,decay:0.01,sustain:0.9, release:0.1} },
  bell:    { oscillator:{type:'sine'},      envelope:{attack:0.001,decay:0.6,sustain:0.0, release:2.0} },
  strings: { oscillator:{type:'sawtooth8'},envelope:{attack:0.35,decay:0.1, sustain:0.8, release:1.2} },
};
const SAMPLER_BASES = {
  piano: {
    baseUrl: 'https://tonejs.github.io/audio/salamander/',
    urls: {
      A0:'A0.mp3',C1:'C1.mp3','D#1':'Ds1.mp3','F#1':'Fs1.mp3',
      A1:'A1.mp3',C2:'C2.mp3','D#2':'Ds2.mp3','F#2':'Fs2.mp3',
      A2:'A2.mp3',C3:'C3.mp3','D#3':'Ds3.mp3','F#3':'Fs3.mp3',
      A3:'A3.mp3',C4:'C4.mp3','D#4':'Ds4.mp3','F#4':'Fs4.mp3',
      A4:'A4.mp3',C5:'C5.mp3','D#5':'Ds5.mp3','F#5':'Fs5.mp3',
      A5:'A5.mp3',C6:'C6.mp3','D#6':'Ds6.mp3','F#6':'Fs6.mp3',
      A6:'A6.mp3',C7:'C7.mp3',
    },
  },
};
const reverb = new Tone.Reverb({decay:2,wet:0.25}).toDestination();
let instrument = new Tone.PolySynth(Tone.Synth, SYNTH_CONFIGS.marimba).connect(reverb);
let instrumentLoaded = true;
let audioReady = false;

async function ensureAudio(){ if(!audioReady){await Tone.start();audioReady=true;} }

async function setInstrument(name, silent=false){
  const sel = document.getElementById('instrument');
  const old = instrument;
  if(SAMPLER_BASES[name]){
    instrumentLoaded = false;
    if(sel) sel.classList.add('loading');
    instrument = new Tone.Sampler({
      ...SAMPLER_BASES[name],
      onload(){ instrumentLoaded=true; if(sel) sel.classList.remove('loading'); },
      onerror(){ if(sel){ sel.classList.remove('loading'); sel.value='marimba'; }
                 setInstrument('marimba',true); return; },
    }).connect(reverb);
  } else {
    instrument = new Tone.PolySynth(Tone.Synth, SYNTH_CONFIGS[name]).connect(reverb);
    instrumentLoaded = true;
  }
  old.dispose();
  if(!silent) savePrefs();
}

function triggerNote(syl){
  if(!audioReady || !instrumentLoaded) return;
  const pitch = NOTE_PITCH[syl];
  if(!pitch) return;
  const isSampler = !!SAMPLER_BASES[document.getElementById('instrument').value];
  const dur = isSampler ? noteDur()/1000*1.6 : Math.max(0.1, noteDur()/1000*0.95);
  instrument.triggerAttackRelease(pitch, dur);
}

// ─────────────────────────────────────────────────────────────────────────────
// BUILD PHRASE DOM
// ─────────────────────────────────────────────────────────────────────────────
function buildPhrase() {
  const el = document.getElementById('phrase');
  el.innerHTML = '';
  PHRASE.forEach((word, wi) => {
    const g = document.createElement('div');
    g.className = 'word-group' + (word.unknown ? ' unknown' : '');
    g.id = `wg-${wi}`;

    const eng = document.createElement('div');
    eng.className = 'eng';
    eng.textContent = word.english;

    const sylsEl = document.createElement('div');
    sylsEl.className = 'syls';

    if (word.solresol.length) {
      word.solresol.forEach((syl, si) => {
        if (si > 0) {
          const sep = document.createElement('span');
          sep.className='sep'; sep.textContent='·';
          sylsEl.appendChild(sep);
        }
        const span = document.createElement('span');
        span.className='syl';
        span.id=`syl-${wi}-${si}`;
        span.textContent=syl;
        span.style.color = COLOR[syl]||'#888';
        sylsEl.appendChild(span);
      });
    } else {
      const q = document.createElement('span');
      q.textContent='?'; q.style.color='#444';
      sylsEl.appendChild(q);
    }

    g.appendChild(eng);
    g.appendChild(sylsEl);
    el.appendChild(g);
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// BUILD STAFF NOTES  (clef + lines stay; only notes are rebuilt)
// ─────────────────────────────────────────────────────────────────────────────
function mk(tag,attrs){
  const e=document.createElementNS(NS,tag);
  for(const[k,v] of Object.entries(attrs)) e.setAttribute(k,v);
  return e;
}

function buildStaff() {
  const svg = document.getElementById('staff');
  svg.innerHTML = '';

  // Glow filter
  const defs = mk('defs',{});
  defs.innerHTML=`<filter id="noteGlow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>`;
  svg.appendChild(defs);

  // Staff lines
  STAFF_LINES.forEach(y=>{
    svg.appendChild(mk('line',{x1:CLEF_W-8,y1:y,x2:SVG_W-PAD_R,y2:y,stroke:'#888','stroke-width':'1.5'}));
  });

  // Treble clef
  const clef=mk('text',{x:4,y:125,'font-size':'90','font-family':'serif',fill:'#aaa'});
  clef.textContent='\u{1D11E}';
  svg.appendChild(clef);

  // Flatten only translatable notes
  SEQ.length = 0;
  PHRASE.forEach((word,wi)=>{
    word.solresol.forEach((syl,si)=>{
      SEQ.push({syl,wi,si,x:0});
    });
  });

  if (!SEQ.length) {
    // Playhead only
    const ph=mk('rect',{x:-2,y:48,width:2,height:110,fill:'#2288FF',opacity:'0',id:'playhead'});
    ph.style.transition='transform 0.12s ease, opacity 0.2s';
    svg.appendChild(ph);
    return;
  }

  const usableW = SVG_W - PAD_R - CLEF_W - 20;
  const step    = usableW / (SEQ.length + 1);
  SEQ.forEach((note,i)=>{ note.x = CLEF_W + 10 + step*(i+1); });

  SEQ.forEach((note,i)=>{
    const {syl,x}=note;
    const y=NOTE_Y[syl], color=COLOR[syl];

    if(syl==='Do'){
      svg.appendChild(mk('line',{x1:x-NOTE_RX-6,y1:y,x2:x+NOTE_RX+6,y2:y,
        stroke:'#888','stroke-width':'1.5',id:`ledger-${i}`}));
    }

    svg.appendChild(mk('circle',{cx:x,cy:y,r:NOTE_RX+14,fill:color,opacity:'0',
      filter:'url(#noteGlow)',id:`halo-${i}`}));

    const stemX=x+NOTE_RX-1;
    svg.appendChild(mk('line',{x1:stemX,y1:y,x2:stemX,y2:y-38,
      stroke:'#bbb','stroke-width':'2',id:`stem-${i}`}));

    svg.appendChild(mk('ellipse',{cx:x,cy:y,rx:NOTE_RX,ry:NOTE_RY,
      fill:color,opacity:'0.6',id:`note-${i}`}));

    const lbl=mk('text',{x,y:158,'text-anchor':'middle','font-size':'11',
      'font-family':'Georgia, serif','font-style':'italic',
      fill:color,opacity:'0.7',id:`lbl-${i}`});
    lbl.textContent=syl;
    svg.appendChild(lbl);
  });

  // Playhead
  const ph=mk('rect',{x:-2,y:48,width:2,height:110,fill:'#2288FF',opacity:'0',id:'playhead'});
  ph.style.transition='transform 0.12s ease, opacity 0.2s';
  svg.appendChild(ph);
}

// ─────────────────────────────────────────────────────────────────────────────
// BACKGROUND BLEND
// ─────────────────────────────────────────────────────────────────────────────
const BG_BASE=[13,15,30];
function bgFor(hex,a=0.28){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return `rgb(${Math.round(BG_BASE[0]*(1-a)+r*a)},${Math.round(BG_BASE[1]*(1-a)+g*a)},${Math.round(BG_BASE[2]*(1-a)+b*a)})`;
}

// ─────────────────────────────────────────────────────────────────────────────
// NOTE / WORD ACTIVATION
// ─────────────────────────────────────────────────────────────────────────────
function activateNote(i,on){
  const note=document.getElementById(`note-${i}`);
  const halo=document.getElementById(`halo-${i}`);
  const stem=document.getElementById(`stem-${i}`);
  const lbl =document.getElementById(`lbl-${i}`);
  if(!note) return;
  const {syl,wi,si}=SEQ[i];
  const sylEl=document.getElementById(`syl-${wi}-${si}`);
  if(on){
    note.setAttribute('opacity','1');
    note.setAttribute('rx', NOTE_RX+8);
    note.setAttribute('ry', NOTE_RY+5);
    halo.setAttribute('opacity','0.55');
    stem.setAttribute('stroke',COLOR[syl]);
    stem.setAttribute('stroke-width','4');
    lbl.setAttribute('opacity','1');
    lbl.setAttribute('font-size','14');
    lbl.setAttribute('font-weight','bold');
    if(sylEl) sylEl.classList.add('current');
    document.body.style.backgroundColor=bgFor(COLOR[syl]);
    triggerNote(syl);
  } else {
    note.setAttribute('opacity','0.6');
    note.setAttribute('rx',NOTE_RX);
    note.setAttribute('ry',NOTE_RY);
    halo.setAttribute('opacity','0');
    stem.setAttribute('stroke','#bbb');
    stem.setAttribute('stroke-width','2');
    lbl.setAttribute('opacity','0.7');
    lbl.setAttribute('font-size','11');
    lbl.setAttribute('font-weight','normal');
    if(sylEl) sylEl.classList.remove('current');
  }
}

function activateWord(wi,on){
  const g=document.getElementById(`wg-${wi}`);
  if(!g) return;
  if(on){
    g.classList.add('active');
    const c=COLOR[PHRASE[wi].solresol[0]]||'#fff';
    g.style.borderColor    =c+'aa';
    g.style.backgroundColor=c+'22';
    g.style.boxShadow      =`0 0 32px ${c}88, 0 0 8px ${c}55`;
  } else {
    g.classList.remove('active');
    g.style.borderColor=g.style.backgroundColor=g.style.boxShadow='';
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// PLAYBACK
// ─────────────────────────────────────────────────────────────────────────────
function bpm()     { return parseInt(document.getElementById('tempo').value); }
function noteDur() { return 60000/bpm(); }

function advance(){
  if(cur>=0) activateNote(cur,false);
  cur++;
  if(cur>=SEQ.length){ finish(); return; }

  const entry=SEQ[cur];
  if(entry.wi!==curWord){
    if(curWord>=0) activateWord(curWord,false);
    curWord=entry.wi;
    activateWord(curWord,true);
  }

  const ph=document.getElementById('playhead');
  if(ph){ ph.style.transform=`translateX(${entry.x}px)`; ph.setAttribute('opacity','0.55'); }

  activateNote(cur,true);
  if(playing) timer=setTimeout(advance,noteDur());
}

function finish(){
  playing=false;
  cur=-1; curWord=-1;
  document.body.classList.remove('playing');
  document.getElementById('playBtn').textContent='▶  Play';
  const ph=document.getElementById('playhead');
  if(ph) ph.setAttribute('opacity','0');
  SEQ.forEach((_,i)=>activateNote(i,false));
  PHRASE.forEach((_,wi)=>activateWord(wi,false));
  setTimeout(()=>{ document.body.style.backgroundColor='#0d0f1e'; }, 800);
}

function doReset(){
  clearTimeout(timer);
  playing=false;
  cur=-1; curWord=-1;
  document.body.classList.remove('playing');
  document.getElementById('playBtn').textContent='▶  Play';
  SEQ.forEach((_,i)=>activateNote(i,false));
  PHRASE.forEach((_,wi)=>activateWord(wi,false));
  const ph=document.getElementById('playhead');
  if(ph) ph.setAttribute('opacity','0');
  document.body.style.backgroundColor='#0d0f1e';
}

function togglePlay(){
  if(playing){
    clearTimeout(timer); playing=false;
    document.body.classList.remove('playing');
    document.getElementById('playBtn').textContent='▶  Play';
    return;
  }
  // Always restart from note 0 — avoids stale-cursor bugs after text changes
  cur = -1; curWord = -1;
  SEQ.forEach((_,i)=>activateNote(i,false));
  PHRASE.forEach((_,wi)=>activateWord(wi,false));
  const ph = document.getElementById('playhead');
  if(ph) ph.setAttribute('opacity','0');
  playing=true;
  document.body.classList.add('playing');
  document.getElementById('playBtn').textContent='⏸  Pause';
  pushStateToURL();
  advance();
}

// ─────────────────────────────────────────────────────────────────────────────
// PERSISTENCE & URL PARAMS
// ─────────────────────────────────────────────────────────────────────────────
const LS_KEY = 'solresol_v1';
function savePrefs(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      instrument: document.getElementById('instrument').value,
      tempo:      document.getElementById('tempo').value,
      text:       document.getElementById('engInput').value,
    }));
  } catch(e){}
}
function loadPrefs(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)||'{}'); } catch(e){ return {}; }
}

// ─────────────────────────────────────────────────────────────────────────────
// TRANSLATE (real-time, debounced)
// ─────────────────────────────────────────────────────────────────────────────
let translateTimer = null;
let lastTranslatedText = '';

function runTranslate(){
  clearTimeout(translateTimer);
  translateTimer = null;
  const text = document.getElementById('engInput').value.trim();
  lastTranslatedText = text;

  clearTimeout(timer);
  playing  = false;
  document.body.classList.remove('playing');
  document.getElementById('playBtn').textContent = '▶  Play';
  document.body.style.backgroundColor = '#0d0f1e';

  PHRASE = text ? translate(text) : [];
  buildPhrase();
  buildStaff();   // rebuilds SEQ

  cur = -1;  curWord = -1;
  const ph = document.getElementById('playhead');
  if (ph) ph.setAttribute('opacity', '0');

  savePrefs();
}

function scheduleTranslate(){
  clearTimeout(translateTimer);
  // Never interrupt active playback with a rebuild
  if (!playing) translateTimer = setTimeout(runTranslate, 320);
}

// ─────────────────────────────────────────────────────────────────────────────
// EVENTS
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('playBtn').addEventListener('click', async e=>{
  e.stopPropagation();
  clearTimeout(translateTimer);
  if(document.getElementById('engInput').value.trim() !== lastTranslatedText) runTranslate();
  await ensureAudio(); togglePlay();
});
document.getElementById('resetBtn').addEventListener('click', e=>{ e.stopPropagation(); doReset(); });
document.getElementById('engInput').addEventListener('input', scheduleTranslate);
document.getElementById('engInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ clearTimeout(translateTimer); runTranslate(); }});
document.getElementById('instrument').addEventListener('change', function(e){
  e.stopPropagation(); setInstrument(this.value);
});
document.getElementById('tempo').addEventListener('input', function(){
  document.getElementById('bpmVal').textContent=this.value; savePrefs();
});
document.body.addEventListener('click', ()=>{ if(playing) togglePlay(); });

// ─────────────────────────────────────────────────────────────────────────────
// URL CONFIG — push state on play, auto-play when config present in URL
// ─────────────────────────────────────────────────────────────────────────────
function buildShareURL(){
  const p = new URLSearchParams();
  p.set('text',       document.getElementById('engInput').value.trim());
  p.set('instrument', document.getElementById('instrument').value);
  p.set('tempo',      document.getElementById('tempo').value);
  return location.origin + location.pathname + '?' + p.toString();
}
function pushStateToURL(){
  history.replaceState(null,'', buildShareURL());
}
document.getElementById('copyUrlBtn').addEventListener('click', e=>{
  e.stopPropagation();
  navigator.clipboard.writeText(buildShareURL()).then(()=>{
    const b = document.getElementById('copyUrlBtn');
    const old = b.textContent; b.textContent = '✓ Copied!';
    setTimeout(()=>{ b.textContent = old; }, 1800);
  });
});

// ─────────────────────────────────────────────────────────────────────────────
// AUDIO DOWNLOAD — render offline via OfflineAudioContext
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('dlAudioBtn').addEventListener('click', async e=>{
  e.stopPropagation();
  const btn = document.getElementById('dlAudioBtn');
  if(btn.classList.contains('working')) return;
  btn.classList.add('working'); btn.textContent = '⏳ Rendering…';
  try {
    // Calculate total duration
    const bpm   = parseInt(document.getElementById('tempo').value,10);
    const beat  = 60/bpm;
    const total = SEQ.length * beat + beat; // pad 1 beat at end
    const sr    = 44100;
    const offCtx = new OfflineAudioContext(2, Math.ceil(total*sr), sr);
    const offReverb = new Tone.Reverb({ decay:2.5, wet:0.22 });
    // Re-create a PolySynth in offline context — Tone.js offline rendering
    await Tone.Offline(async ()=>{
      const instName = document.getElementById('instrument').value;
      let offInst;
      if(SYNTH_CONFIGS[instName]){
        offInst = new Tone.PolySynth(Tone.Synth, SYNTH_CONFIGS[instName]);
      } else {
        offInst = new Tone.PolySynth(Tone.Synth, SYNTH_CONFIGS.marimba);
      }
      const offRev = new Tone.Reverb({ decay:2.5, wet:0.22 });
      await offRev.ready;
      offInst.connect(offRev);
      offRev.toDestination();
      const noteDur = beat * 0.85;
      SEQ.forEach((item, idx)=>{
        const t = idx * beat;
        offInst.triggerAttackRelease(NOTE_PITCH[item.syl], noteDur, t);
      });
    }, total).then(buf=>{
      // Encode to WAV
      const wav = audioBufferToWav(buf);
      const blob = new Blob([wav], { type:'audio/wav' });
      const url  = URL.createObjectURL(blob);
      const a    = document.createElement('a');
      a.href     = url;
      a.download = 'solresol.wav';
      a.click();
      setTimeout(()=>URL.revokeObjectURL(url), 5000);
    });
  } catch(err){
    alert('Audio export failed: '+err.message);
    console.error(err);
  } finally {
    btn.classList.remove('working'); btn.textContent = '⬇ Audio';
  }
});

// Minimal PCM WAV encoder
function audioBufferToWav(buffer){
  const numCh = buffer.numberOfChannels;
  const sr    = buffer.sampleRate;
  const len   = buffer.length;
  const ab    = new ArrayBuffer(44 + len * numCh * 2);
  const view  = new DataView(ab);
  function str(o,s){ for(let i=0;i<s.length;i++) view.setUint8(o+i,s.charCodeAt(i)); }
  function u32(o,v){ view.setUint32(o,v,true); }
  function u16(o,v){ view.setUint16(o,v,true); }
  str(0,'RIFF'); u32(4,36+len*numCh*2); str(8,'WAVE');
  str(12,'fmt '); u32(16,16); u16(20,1); u16(22,numCh);
  u32(24,sr); u32(28,sr*numCh*2); u16(32,numCh*2); u16(34,16);
  str(36,'data'); u32(40,len*numCh*2);
  const ch = [];
  for(let c=0;c<numCh;c++) ch.push(buffer.getChannelData(c));
  let off=44;
  for(let i=0;i<len;i++){
    for(let c=0;c<numCh;c++){
      const s = Math.max(-1,Math.min(1,ch[c][i]));
      view.setInt16(off, s<0 ? s*0x8000 : s*0x7FFF, true);
      off+=2;
    }
  }
  return ab;
}

// ─────────────────────────────────────────────────────────────────────────────
// VIDEO DOWNLOAD — canvas-capture MediaRecorder
// ─────────────────────────────────────────────────────────────────────────────
document.getElementById('dlVideoBtn').addEventListener('click', async e=>{
  e.stopPropagation();
  const btn = document.getElementById('dlVideoBtn');
  if(btn.classList.contains('working')) return;
  if(!('MediaRecorder' in window)){
    alert('MediaRecorder not supported in this browser. Try Chrome.');
    return;
  }
  btn.classList.add('working'); btn.textContent = '⏳ Recording…';
  try {
    const bpm      = parseInt(document.getElementById('tempo').value,10);
    const beat     = 60/bpm;
    const noteDurMs = beat * 1000;
    // Snapshot the staff SVG into an offscreen canvas for each note frame
    const staffEl  = document.getElementById('staff');
    const phraseEl = document.getElementById('phrase');
    const W = 900, H = 540;
    const canvas   = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx2d    = canvas.getContext('2d');
    // Set up MediaRecorder
    const stream  = canvas.captureStream(30);
    // Try to get system audio — not possible in browser; mix in silence
    const audioCtx = new AudioContext();
    const dest     = audioCtx.createMediaStreamDestination();
    const silence  = audioCtx.createGain(); silence.gain.value=0;
    silence.connect(dest);
    stream.addTrack(dest.stream.getTracks()[0]);
    const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
      ? 'video/webm;codecs=vp9,opus' : 'video/webm';
    const rec = new MediaRecorder(stream, { mimeType });
    const chunks = [];
    rec.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
    // Helper: draw a single frame
    async function drawFrame(noteIdx){
      return new Promise(res=>{
        // Background color
        const col = noteIdx >= 0 ? COLOR[SEQ[noteIdx].syl] : '#0d0f1e';
        const bg  = noteIdx >= 0 ? bgFor(col) : '#0d0f1e';
        ctx2d.fillStyle = bg;
        ctx2d.fillRect(0,0,W,H);
        // Use foreignObject trick: draw phrase + staff via SVG data URL
        const svgStr = `<svg xmlns='http://www.w3.org/2000/svg' width='${W}' height='${H}'>
          <foreignObject width='${W}' height='${H}'>
            <div xmlns='http://www.w3.org/1999/xhtml' style='width:${W}px;height:${H}px;background:${bg};display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;font-family:Georgia,serif;'>
            </div>
          </foreignObject>
        </svg>`;
        const img = new Image();
        img.onload = ()=>{ ctx2d.drawImage(img,0,0); res(); };
        img.onerror = ()=>res();
        img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgStr)));
      });
    }
    // Simple approach: paint frames per note using requestAnimationFrame timing
    rec.start(100);
    await ensureAudio();
    // Activate each note visually and play audio in sync
    for(let i=0; i<SEQ.length; i++){
      const item = SEQ[i];
      const col  = COLOR[item.syl];
      const bg   = bgFor(col);
      ctx2d.fillStyle = bg;
      ctx2d.fillRect(0,0,W,H);
      // Title
      ctx2d.fillStyle = '#55555588';
      ctx2d.font = '18px Georgia';
      ctx2d.textAlign = 'center';
      ctx2d.fillText('SOLRESOL', W/2, 50);
      // Syl pill
      ctx2d.font = 'bold 72px Georgia';
      ctx2d.fillStyle = col;
      ctx2d.textAlign = 'center';
      ctx2d.fillText(item.syl, W/2, H/2 - 20);
      // English word
      const word = PHRASE[item.wi] ? PHRASE[item.wi].english : '';
      ctx2d.font = '36px Georgia';
      ctx2d.fillStyle = '#ffffff';
      ctx2d.fillText(word, W/2, H/2 + 48);
      // Pitch
      ctx2d.font = '20px Georgia';
      ctx2d.fillStyle = col+'99';
      ctx2d.fillText(NOTE_PITCH[item.syl], W/2, H/2 + 90);
      instrument.triggerAttackRelease(NOTE_PITCH[item.syl], beat*0.85);
      await new Promise(r=>setTimeout(r, noteDurMs));
    }
    // Pause a beat then stop
    await new Promise(r=>setTimeout(r, noteDurMs));
    rec.stop();
    await new Promise(r=>{ rec.onstop = r; });
    const blob = new Blob(chunks, {type: mimeType});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'solresol.webm'; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
    audioCtx.close();
  } catch(err){
    alert('Video export failed: '+err.message);
    console.error(err);
  } finally {
    btn.classList.remove('working'); btn.textContent = '⬇ Video';
  }
});

// ─────────────────────────────────────────────────────────────────────────────
// INIT — URL param > localStorage > default
// ─────────────────────────────────────────────────────────────────────────────
(async()=>{
  const prefs  = loadPrefs();
  const params = new URLSearchParams(window.location.search);
  const urlText = params.get('text');
  const urlInst = params.get('instrument');
  const urlTempo= params.get('tempo');
  const hasURLConfig = urlText || urlInst || urlTempo;

  // Restore tempo — URL wins
  const tempo = urlTempo || prefs.tempo || '72';
  document.getElementById('tempo').value = tempo;
  document.getElementById('bpmVal').textContent = tempo;

  // Restore instrument UI (audio not started yet, just set select value)
  const instName = urlInst || prefs.instrument || 'piano';
  document.getElementById('instrument').value = instName;
  // Kick off sampler load immediately so it's ready when user hits play
  await setInstrument(instName, true);

  // Restore / set text — URL param wins
  const text = urlText ?? prefs.text ?? 'What is your name';
  document.getElementById('engInput').value = text;
  lastTranslatedText = text.trim();

  PHRASE = translate(text);
  buildPhrase();
  buildStaff();

  // Auto-play if URL had config params (shareable link)
  if(hasURLConfig){
    await ensureAudio();
    togglePlay();
  }
})();
